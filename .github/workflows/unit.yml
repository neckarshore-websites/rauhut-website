name: Unit

# CI gate for the pure Node/tsx unit tests (Test Charter §4c — every existing
# suite must run in CI). Green locally but invoked by no workflow. Fast, no
# browser, no secrets — kept in their own lightweight job.

on:
  push:
    branches: [main]
    # A stats.json-only commit (pushed by e2e.yml's emit-stats job) must not re-trigger
    # this workflow — nothing here depends on the emitted data file.
    paths-ignore:
      - 'stats.json'
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  unit:
    name: Node unit tests
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # 22, not 20: test:unit runs a TypeScript test file directly via
          # node --test, which needs Node >=22.6's native type-stripping.
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run lighthouse-profile unit tests
        run: npm run test:lighthouse:unit

      - name: Run contact-action + lighthouse-url unit tests
        run: npm run test:unit

      # agentRules guard (#2360, revised 2026-09-25). The suite above includes the guard's
      # PURE tests (scripts/check-agent-files.test.mjs, appended to test:unit), which would
      # stay green without ever opening the config. This step imports the REAL
      # next.config.ts and reads the real checkout: it fails when `agentRules: false` is
      # gone, when an AGENTS.md is committed, or when CLAUDE.md carries the generated block.
      - name: Check the agentRules switch and agent files
        run: npm run check:agent-files
